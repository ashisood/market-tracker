name: Validate

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "briefs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check stocks.yaml and config.yaml
        run: python market_brief.py --validate

      - name: Run tests
        run: python -m unittest discover -s tests -v
